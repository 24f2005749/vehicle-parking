{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block navbar %}
  {% include "auth/nav-auth.html" %}
{% endblock %}

{% block styles %}
<style>
  h2 {
    text-align: center;
  }
  .box {
    display: flex;
    flex-direction: column;
    width: 30%;
    margin: 15vh auto;
  }
  .form-box {
    display: flex;
    flex-direction: column;
    padding: 1rem;
  }
  #create-new {
    text-align: center;
    margin-top: 1rem;
    display: block;
    font-size: 18px;
    color: rgb(255, 255, 255);
    text-decoration: none;
  }
</style>
{% endblock %}

{% block content %}


<div class="box">
  <h2>Login</h2>
  <form method="post" class="form-box">
    <label for="username" class="form-label">
      Username
      <input type="text" name="username" id="username" class="form-control" required>
    </label>
    <label for="password" class="form-label">
      Password
      <input type="password" name="password" id="password" class="form-control" required>
    </label>
    <input type="submit" value="Login" class="btn mt-4 btn-success w-100">
    <a id="create-new" href="/register">Create Account</a>
  </form>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
